[package]
name = "xprofiler-rs"
version = "3.1.0"
edition = "2021"
license = "BSD-2-Clause"
description = "Node.js addon for runtime profiling and performance monitoring"
repository = "https://github.com/X-Profiler/xprofiler"
authors = ["X-Profiler Contributors"]

[lib]
crate-type = ["cdylib"]

[dependencies]
# napi-rs for Node.js bindings (latest v3)
napi = { version = "3", default-features = false, features = ["napi8", "serde-json"] }
napi-derive = "3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Concurrency primitives
parking_lot = "0.12"
once_cell = "1"

# Date/time handling
chrono = "0.4"

# Error handling
thiserror = "2"

# Logging/tracing
tracing = "0.1"

# Async runtime for IPC
tokio = { version = "1", features = ["rt", "sync", "time", "io-util", "net", "macros"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
nix = { version = "0.30", features = ["socket", "uio", "process", "signal", "fs"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_Performance",
    "Win32_Security",
    "Win32_Storage_FileSystem",
]}

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
opt-level = 3
strip = "symbols"

[profile.dev]
opt-level = 0
debug = true
