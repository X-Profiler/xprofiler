name: Continuous integration
on:
  push:
    branches: [ '**' ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ '**' ]
permissions:
  contents: read

jobs:
  version:
    name: Check release version
    if: >-
      (github.event_name == 'pull_request' && github.base_ref == 'master') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
      dist_tag: ${{ steps.version.outputs.dist_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install release check dependencies
        run: npm install --ignore-scripts --no-package-lock
      - name: Check version change
        id: version
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-release.js "$BASE_REF"

  Runner:
    runs-on: ${{ matrix.ci-type.os }}
    strategy:
      fail-fast: false
      matrix:
        ci-type: [
          {os: "windows-latest", arch: "x64"},
          {os: "macos-latest", arch: "x64"},
          {os: "ubuntu-latest", arch: "x64"},
        ]
        node-version: [ 22, 24, 26 ]
    steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'

    - name: Checkout Git Source
      uses: actions/checkout@v7

    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v3
      if: ${{ matrix.ci-type.os == 'windows-latest' }}

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        package-manager-cache: false

    # npm bundled with Node.js 22 uses node-gyp 11, which cannot detect VS 2026.
    # Use the same npm/node-gyp toolchain on every supported runtime.
    - name: Setup npm
      run: npm install --global npm@11.19.1

    - name: Install Dependencies
      run: npm install

    - name: Continuous Integration
      run: npm run ci

    - name: Code Coverage
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: Build Node.js ${{ matrix.node-version }} ${{ matrix.target.platform }} ${{ matrix.target.arch }}
    runs-on: ${{ matrix.target.os }}
    container: ${{ matrix.target.container }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        node-version: [ 22, 24, 26 ]
        target:
          # Build on glibc 2.28 so Linux assets also work on older distributions.
          - os: ubuntu-22.04
            platform: linux
            arch: x64
            container: quay.io/pypa/manylinux_2_28_x86_64
          - os: ubuntu-22.04-arm
            platform: linux
            arch: arm64
            container: quay.io/pypa/manylinux_2_28_aarch64
          - os: macos-15-intel
            platform: darwin
            arch: x64
            container: ''
          - os: macos-15
            platform: darwin
            arch: arm64
            container: ''
          - os: windows-latest
            platform: win32
            arch: x64
            container: ''
        exclude:
          # This asset is built against glibc 2.17 in build_linux_glibc217.
          - node-version: 22
            target:
              os: ubuntu-22.04
              platform: linux
              arch: x64
              container: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        if: runner.os != 'Linux'
        with:
          python-version: '3.10'
      - name: Set up Linux Python
        if: runner.os == 'Linux'
        run: |
          manylinux-interpreters ensure cp312-cp312
          echo "PYTHON=/opt/python/cp312-cp312/bin/python" >> "$GITHUB_ENV"
      - uses: microsoft/setup-msbuild@v3
        if: runner.os == 'Windows'
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          architecture: ${{ matrix.target.arch }}
          package-manager-cache: false
      - name: Setup npm
        run: npm install --global npm@11.19.1
      - name: Install dependencies
        run: npm install --ignore-scripts --no-package-lock
      - name: Build native addon
        run: npm run build
      - name: Package native addon
        run: npm run pack
      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.node-version }}-${{ matrix.target.platform }}-${{ matrix.target.arch }}
          path: release/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  build_linux_glibc217:
    name: Build Node.js 22 linux x64 (glibc 2.17)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Keep JavaScript actions on the host: their Node.js runtime needs glibc 2.28.
      - name: Build and package for glibc 2.17
        env:
          NODE_VERSION: 22.23.5
          NODE_SHA256: 6f7345b0bccaba0d6d8e435904f604f7b56f12bf962941b39a21f1fee77f084d
        run: |
          docker run --rm --platform linux/amd64 \
            -e NODE_VERSION -e NODE_SHA256 \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            quay.io/pypa/manylinux2014_x86_64 \
            bash scripts/build-linux-glibc217.sh
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Check official Node.js 22 compatibility
        run: |
          node -e 'const binary = require("@mapbox/node-pre-gyp");
            require(binary.find(require("path").resolve("package.json")));'
      - uses: actions/upload-artifact@v7
        with:
          name: binary-22-linux-x64
          path: release/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  release:
    name: Release
    needs: [ version, Runner, build, build_linux_glibc217 ]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      github.repository == 'X-Profiler/xprofiler' &&
      needs.version.outputs.changed == 'true'
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.version.outputs.version }}
      dist_tag: ${{ needs.version.outputs.dist_tag }}
