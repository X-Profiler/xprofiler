name: Continuous integration
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ '**' ]
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Check release version
    if: github.event_name == 'pull_request' && github.base_ref == 'master'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install release check dependencies
        run: npm install --ignore-scripts --no-package-lock
      - name: Check version change
        id: version
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-release.js "$BASE_REF"

  Runner:
    runs-on: ${{ matrix.ci-type.os }}
    strategy:
      fail-fast: false
      matrix:
        ci-type: [
          {os: "windows-latest", arch: "x64"},
          {os: "macos-latest", arch: "x64"},
          {os: "ubuntu-latest", arch: "x64"},
        ]
        node-version: [ 22, 24, 26 ]
    steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'

    - name: Checkout Git Source
      uses: actions/checkout@v7

    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v3
      if: ${{ matrix.ci-type.os == 'windows-latest' }}

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        package-manager-cache: false

    # npm bundled with Node.js 22 uses node-gyp 11, which cannot detect VS 2026.
    # Use the same npm/node-gyp toolchain on every supported runtime.
    - name: Setup npm
      run: npm install --global npm@11.19.1

    - name: Install Dependencies
      run: npm install

    - name: Continuous Integration
      run: npm run ci

    - name: Code Coverage
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: Binary builds
    needs: version
    if: github.event_name == 'pull_request' && needs.version.outputs.changed == 'true'
    uses: ./.github/workflows/build-binaries.yml

  build_status:
    name: Check binary builds
    needs: [ version, build ]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.base_ref == 'master' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check required builds
        env:
          VERSION_RESULT: ${{ needs.version.result }}
          VERSION_CHANGED: ${{ needs.version.outputs.changed }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          if [ "$VERSION_RESULT" != success ]; then
            echo "::error::Release version check did not succeed."
            exit 1
          fi
          case "$VERSION_CHANGED:$BUILD_RESULT" in
            true:success|false:skipped) ;;
            *)
              echo "::error::Unexpected binary build result: version changed=$VERSION_CHANGED, builds=$BUILD_RESULT"
              exit 1
              ;;
          esac
