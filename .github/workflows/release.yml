name: Release
on:
  push:
    branches: [ master ]
    paths: [ package.json ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

concurrency:
  # Replace stale PR checks, but keep every publishing run on master.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    name: Check release version
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
      dist_tag: ${{ steps.version.outputs.dist_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install release check dependencies
        run: npm install --ignore-scripts --no-package-lock
      - name: Check version change
        id: version
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-release.js "$BASE_REF"

  build:
    name: Binary builds
    needs: version
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      github.repository == 'X-Profiler/xprofiler' &&
      needs.version.outputs.changed == 'true'
    uses: ./.github/workflows/build-binaries.yml

  publish:
    name: Publish GitHub release and npm package
    needs: [ version, build ]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      github.repository == 'X-Profiler/xprofiler' &&
      needs.version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: npm-release-${{ needs.version.outputs.version }}
      cancel-in-progress: false
    env:
      RELEASE_TAG: v${{ needs.version.outputs.version }}
      NPM_DIST_TAG: ${{ needs.version.outputs.dist_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install release check dependencies
        run: npm install --ignore-scripts --no-package-lock
      - name: Check published version
        id: npm
        run: node scripts/check-release.js --published
      - name: Check existing tag
        shell: bash
        run: |
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            tag_commit=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
            if [ "$tag_commit" != "$GITHUB_SHA" ]; then
              echo "::error::Tag $RELEASE_TAG already points to another commit."
              exit 1
            fi
          fi
      - uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: release
          merge-multiple: true
      - name: Publish GitHub release with native addons
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          shopt -s nullglob
          files=(release/*.tar.gz)
          # Five platform/architecture targets for each of three Node.js majors.
          if [ "${#files[@]}" -ne 15 ]; then
            echo "::error::Expected 15 native addon assets, found ${#files[@]}."
            exit 1
          fi

          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            args=(--target "$GITHUB_SHA" --title "$RELEASE_TAG" --generate-notes --draft)
            if [ "$NPM_DIST_TAG" != latest ]; then
              args+=(--prerelease --latest=false)
            fi
            gh release create "$RELEASE_TAG" "${args[@]}"
          fi

          uploaded=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[] | select(.state == "uploaded") | .name')
          for file in "${files[@]}"; do
            if ! grep -Fxq "${file##*/}" <<< "$uploaded"; then
              gh release upload "$RELEASE_TAG" "$file" --clobber
            fi
          done

          if [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true ]; then
            gh release edit "$RELEASE_TAG" --draft=false
          fi
      - name: Publish with npm trusted publishing
        if: steps.npm.outputs.published == 'false'
        run: npm publish --access public --tag "$NPM_DIST_TAG" --registry=https://registry.npmjs.org
